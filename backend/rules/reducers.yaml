category: reducers
description: "Negative-weight rules that reduce risk score for verified legitimate indicators (e.g., standard masked bank debit SMS, verified brand domain)."

rules:
  - id: REDUCER_VERIFIED_BRAND_DOMAIN
    label: "Exact Verified Brand Domain Match"
    category: reducers
    weight: -15.0
    description: "Link points to an officially verified root domain from the known legitimate brands registry with zero lookalike anomalies."
    advice: "The domain matches the official brand registry. Ensure you do not submit sensitive credentials if unprompted."
    patterns:
      en:
        - "(?i)verified\\s+official\\s+brand\\s+domain\\s+match"
        - "(?i)destination\\s+domain\\s+is\\s+whitelisted"
        - "(?i)official\\s+bank\\s+website\\s+confirmed"
      ta: # needs native-speaker review
        - "(?i)உறுதிப்படுத்தப்பட்ட\\s*அதிகாரப்பூர்வ\\s*வலைத்தளம்"
        - "(?i)verified\\s+brand\\s+domain\\s+match"
        - "(?i)unmaiyana\\s+official\\s+domain"
      hi: # needs native-speaker review
        - "(?i)सत्यापित\\s*आधिकारिक\\s*ब्रांड\\s*डोमेन"
        - "(?i)विश्वसनीय\\s*आधिकारिक\\s*वेबसाइट"
        - "(?i)verified\\s+official\\s+domain"
        - "(?i)sahi\\s+official\\s+bank\\s+domain"

  - id: REDUCER_STANDARD_MASKED_DEBIT_SMS
    label: "Standard Bank Masked Debit / Credit Transaction Alert"
    category: reducers
    weight: -20.0
    description: "Standard informative transactional SMS stating an account has been debited or credited, showing masked account number (e.g., A/c **1234) and remaining balance, without threatening action or demanding clicks."
    advice: "This appears to be a standard transaction confirmation SMS from a bank. No immediate action is required unless you did not authorize the debit."
    patterns:
      en:
        - "(?i)(?:a/c|acct|account)\\s*(?:no\\.?)?\\s*(?:xx+|\\*\\*+)[0-9]{3,4}\\s+(?:is|has\\s+been)?\\s*(?:debited|credited)\\s+(?:by|with|for)?\\s*(?:rs\\.?|inr|₹)?\\s*[0-9]+(?:\\.[0-9]{2})?"
        - "(?i)(?:debited|credited)\\s+(?:for|with)?\\s*(?:rs\\.?|inr|₹)?\\s*[0-9]+(?:\\.[0-9]{2})?\\s+(?:from|to)\\s+a/c\\s*(?:xx+|\\*\\*+)[0-9]{3,4}"
        - "(?i)avl\\s+bal(?:ance)?\\s*:?\\s*(?:rs\\.?|inr|₹)?\\s*[0-9]+"
      ta: # needs native-speaker review
        - "(?i)கணக்கு\\s*எண்\\s*\\*\\*[0-9]+\\s*(?:இருந்து\\s*பணம்\\s*எடுக்கப்பட்டது|வரவு\\s*வைக்கப்பட்டது)"
        - "(?i)வங்கி\\s*பரிவர்த்தனை\\s*செய்தி"
        - "(?i)debited\\s+from\\s+ac\\s+xx"
        - "(?i)bank\\s+account\\s+la\\s+irundhu\\s+debit"
      hi: # needs native-speaker review
        - "(?i)खाता\\s*\\*\\*[0-9]+\\s*(?:से\\s*डेबिट|में\\s*क्रेडिट)\\s*किया\\s*गया"
        - "(?i)खाते\\s*से\\s*रुपये\\s*कटने\\s*का\\s*सामान्य\\s*संदेश"
        - "(?i)debited\\s+for\\s+inr\\s+bal"
        - "(?i)khata\\s+se\\s+paisa\\s+kata"

  - id: REDUCER_STANDARD_2FA_USER_INITIATED
    label: "Standard Informative OTP / Login Code (With Do Not Share Warning)"
    category: reducers
    weight: -15.0
    description: "Standard one-time password SMS containing security warning ('Do not share with anyone including bank officials')."
    advice: "This is a security verification code. If you requested it, use it only in your active official app session. Never disclose it to callers."
    patterns:
      en:
        - "(?i)is\\s+your\\s+(?:secret\\s+)?(?:otp|verification\\s*code).*do\\s+not\\s+share(?:\\s+with\\s+anyone)?"
        - "(?i)use\\s+code\\s+\\d{4,8}\\s+to\\s+login.*never\\s+share\\s+otp"
        - "(?i)bank\\s+never\\s+asks\\s+for\\s+otp"
      ta: # needs native-speaker review
        - "(?i)ரகசிய\\s*ஓடிபி.*யாரிடமும்\\s*பகிர\\s*வேண்டாம்"
        - "(?i)otp\\s+yarukum\\s+share\\s+panadhinga"
        - "(?i)do\\s+not\\s+share\\s+otp"
      hi: # needs native-speaker review
        - "(?i)आपका\\s*ओटीपी\\s*है.*किसी\\s*के\\s*साथ\\s*साझा\\s*न\\s*करें"
        - "(?i)बैंक\\s*कभी\\s*ओटीपी\\s*नहीं\\s*मांगता"
        - "(?i)otp\\s+kisi\\s+ko\\s+na\\s+bataye"
        - "(?i)do\\s+not\\s+share\\s+otp"
