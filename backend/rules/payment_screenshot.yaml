category: payment_screenshot
description: "Rules detecting fake or manipulated payment screenshots (UPI, NetBanking, IMPS) used in fake payment and overpayment scams."

rules:
  - id: PAY_PENDING_STATUS_AS_PAID
    label: "Pending or Processing Payment Claimed as Completed"
    category: payment_screenshot
    weight: 20.0
    description: "Transaction screenshot displays status as 'Pending', 'Processing', or 'Scheduled', but is presented as proof of credited payment."
    advice: "Never release goods, orders, or services based on pending payment screenshots. Check your own bank account balance directly."
    patterns:
      en:
        - "(?i)(?:payment|transaction|status)\\s*(?:is\\s+)?(?:pending|processing|queued|scheduled|in\\s*progress)"
        - "(?i)awaiting\\s+bank\\s+confirmation"
        - "(?i)money\\s+will\\s+reach\\s+within\\s+\\d+\\s*(?:hours|days)"
      ta: # needs native-speaker review
        - "(?i)பரிவர்த்தனை\\s*(?:நிலுவையில்\\s*உள்ளது|செயல்பாட்டில்\\s*உள்ளது)"
        - "(?i)pending\\s+status\\s+irukku"
        - "(?i)processing\\s+la\\s+irukku"
      hi: # needs native-speaker review
        - "(?i)भुगतान\\s*(?:लंबित|प्रोसेसिंग|प्रक्रियाधीन)\\s*है"
        - "(?i)ट्रांजेक्शन\\s*पेंडिंग\\s*दिखाया\\s*गया\\s*है"
        - "(?i)pending\\s+payment\\s+screenshot"
        - "(?i)bank\\s+confirmation\\s+ka\\s+intezar"

  - id: PAY_INVALID_UPI_UTR
    label: "Invalid UPI Reference Number (UTR)"
    category: payment_screenshot
    weight: 15.0
    description: "UPI UTR/Reference number does not conform to the NPCI standard 12-digit numerical format or is clearly fabricated."
    advice: "Every legitimate Indian UPI transaction generates a strictly 12-digit numeric Unique Transaction Reference (UTR)."
    patterns:
      en:
        - "(?i)(?:upi\\s+ref(?:\\s+no)?|utr|txn\\s+id|rrn)\\s*:?\\s*(?:[a-zA-Z0-9]{1,11}|[a-zA-Z0-9]{13,})(?:\\s|$)"
        - "(?i)non-12-digit\\s+upi\\s+utr"
        - "(?i)invalid\\s+utr\\s+format"
      ta: # needs native-speaker review
        - "(?i)தவறான\\s*அல்லது\\s*12\\s*இலக்கமற்ற\\s*யூபிஐ\\s*யுடிஆர்\\s*எண்"
        - "(?i)invalid\\s+upi\\s+utr\\s+number"
        - "(?i)utr\\s+format\\s+thappu"
      hi: # needs native-speaker review
        - "(?i)अमान्य\\s*या\\s*गैर-12-अंकीय\\s*यूपीआई\\s*यूटीआर\\s*(UTR)\\s*नंबर"
        - "(?i)गलत\\s*यूटीआर\\s*फॉर्मेट"
        - "(?i)invalid\\s+utr\\s+detected"
        - "(?i)12\\s+digit\\s+utr\\s+nahi\\s+hai"

  - id: PAY_IMPOSSIBLE_FUTURE_TIMESTAMP
    label: "Impossible or Future Transaction Timestamp"
    category: payment_screenshot
    weight: 20.0
    description: "Payment receipt displays a timestamp dated in the future, or time of payment is later than device clock."
    advice: "Fabricated receipts created by fake payment generators (e.g. Paytm Spoof apps) often have erratic or future dates."
    patterns:
      en:
        - "(?i)(?:impossible|future)\\s+(?:timestamp|transaction\\s+date|time)"
        - "(?i)receipt\\s+timestamp\\s+is\\s+ahead\\s+of\\s+current\\s+time"
        - "(?i)date\\s+mismatch\\s+with\\s+system\\s+clock"
      ta: # needs native-speaker review
        - "(?i)எதிர்கால\\s*அல்லது\\s*சாத்தியமற்ற\\s*பரிவர்த்தனை\\s*நேரம்"
        - "(?i)future\\s+date\\s+payment\\s+receipt"
        - "(?i)time\\s+mismatch\\s+screenshot"
      hi: # needs native-speaker review
        - "(?i)भविष्य\\s*की\\s*या\\s*असंभव\\s*लेन-देन\\s*की\\s*तारीख"
        - "(?i)रसीद\\s*का\\s*समय\\s*वर्तमान\\s*समय\\s*से\\s*आगे"
        - "(?i)future\\s+timestamp\\s+screenshot"
        - "(?i)galat\\s+tarikh\\s+aur\\s+samay"

  - id: PAY_EDITED_CROPPED_IMAGE
    label: "Edited Fields or Cropped Status Bar"
    category: payment_screenshot
    weight: 15.0
    description: "Visual inspection notes indicate cropped status bar, mismatched battery/clock icons, or visible patch artifacts around amounts."
    advice: "Screenshots generated by fake payment prank apps frequently show cropped status bars or blurry edits around the amount."
    patterns:
      en:
        - "(?i)visual\\s+notes?:?.*(?:cropped\\s+status\\s*bar|edited\\s+amount|tampered\\s+field|patch\\s+artifact|inconsistent\\s+battery)"
        - "(?i)manipulated\\s+payment\\s+screenshot"
        - "(?i)fake\\s+paytm\\s+spoof\\s+generator\\s+artifact"
      ta: # needs native-speaker review
        - "(?i)திருத்தப்பட்ட\\s*அல்லது\\s*வெட்டப்பட்ட\\s*திரைப்படம்"
        - "(?i)cropped\\s+status\\s+bar\\s+tampered"
        - "(?i)fake\\s+payment\\s+screenshot\\s+edit"
      hi: # needs native-speaker review
        - "(?i)एडिट\\s*किया\\s*गया\\s*या\\s*काटा\\s*गया\\s*स्क्रीनशॉट"
        - "(?i)राशि\\s*या\\s*स्टेटस\\s*बार\\s*में\\s*छेड़छाड़"
        - "(?i)edited\\s+screenshot\\s+hai"
        - "(?i)cropped\\s+fake\\s+receipt"

  - id: PAY_AMOUNT_FONT_MISMATCH
    label: "Amount Font or Currency Symbol Distortion"
    category: payment_screenshot
    weight: 15.0
    description: "Currency symbol or numerical amount appears in a different font weight, kerning, or color compared to the surrounding interface."
    advice: "Genuine banking apps use fixed system typography. Differing fonts or blurry numeric values indicate digital alteration."
    patterns:
      en:
        - "(?i)visual\\s+notes?:?.*(?:amount\\s+font\\s+mismatch|different\\s+kerning|currency\\s+symbol\\s+distortion|blurry\\s+amount)"
        - "(?i)font\\s+discrepancy\\s+on\\s+transferred\\s+amount"
        - "(?i)uneven\\s+text\\s+alignment\\s+in\\s+receipt"
      ta: # needs native-speaker review
        - "(?i)தொகை\\s*எழுத்துரு\\s*முரண்பாடு"
        - "(?i)amount\\s+font\\s+mismatch\\s+irukku"
        - "(?i)panam\\s+font\\s+thappu"
      hi: # needs native-speaker review
        - "(?i)राशि\\s*के\\s*फ़ॉन्ट\\s*या\\s*रंग\\s*में\\s*भिन्नता"
        - "(?i)रुपये\\s*के\\s*चिह्न\\s*में\\s*छेड़छाड़"
        - "(?i)amount\\s+font\\s+mismatch"
        - "(?i)font\\s+alag\\s+dikh\\s+raha\\s+hai"
