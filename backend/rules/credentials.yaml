category: credentials
description: "Rules detecting solicitations for OTP, PIN, CVV, NetBanking passwords, Aadhaar, PAN, and full card details."

rules:
  - id: CRED_OTP_SOLICITATION
    label: "One-Time Password (OTP) Solicitation"
    category: credentials
    weight: 35.0
    description: "Requests sharing or forwarding an OTP / verification code."
    advice: "Never share OTPs with anyone. Bank representatives and customer care never ask for OTPs."
    patterns:
      en:
        - "(?i)(?:share|send|provide|forward|enter|tell)\\s+(?:(?:me|us|your)\\s+)?(?:(?:4|6)[- ]digit\\s+)?(?:otp|one\\s*time\\s*password|verification\\s*code)"
        - "(?i)tell\\s+(?:me|us)\\s+the\\s+(?:6|4)[- ]digit\\s+(?:otp|code)"
        - "(?i)otp\\s+(?:is\\s+required|needed\\s+to\\s+cancel|mandatory)"
      ta: # needs native-speaker review
        - "(?i)ஓடிபி\\s*(?:பகிரவும்|கூறவும்|அனுப்பவும்)"
        - "(?i)ஒருமுறை\\s*கடவுச்சொல்"
        - "(?i)otp\\s+share\\s+pannunga"
        - "(?i)otp\\s+solunga"
      hi: # needs native-speaker review
        - "(?i)ओटीपी\\s*(?:साझा\\s*करें|बताएं|भेजें)"
        - "(?i)वेरिफिकेशन\\s*कोड\\s*(?:बताएं|दीजिये)"
        - "(?i)otp\\s+batao"
        - "(?i)otp\\s+share\\s+kare"

  - id: CRED_UPI_PIN_RECEIVE_DECEPTION
    label: "UPI PIN Required to Receive Funds"
    category: credentials
    weight: 35.0
    description: "Instructs user to enter their UPI PIN to receive, claim, or refund money."
    advice: "You NEVER need to enter your UPI PIN to receive money. Entering your PIN transfers money OUT of your account."
    patterns:
      en:
        - "(?i)enter\\s+(?:upi\\s+)?pin\\s+to\\s+(?:receive|claim|accept|credit|refund)"
        - "(?i)type\\s+pin\\s+and\\s+(?:money|cash)\\s+will\\s+be\\s+credited"
        - "(?i)scan\\s+(?:qr\\s+code)?\\s+and\\s+enter\\s+pin\\s+to\\s+receive"
      ta: # needs native-speaker review
        - "(?i)பணம்\\s*வர\\s*பின்\\s*எண்ணை\\s*உள்ளிடவும்"
        - "(?i)upi\\s*pin\\s*போட்டு\\s*பணம்\\s*பெறவும்"
        - "(?i)pin\\s+potta\\s+kaasu\\s+varum"
      hi: # needs native-speaker review
        - "(?i)पैसे\\s*पाने\\s*के\\s*लिए\\s*यूपीआई\\s*पिन\\s*दर्ज\\s*करें"
        - "(?i)पिन\\s*डालें\\s*और\\s*पैसे\\s*खाते\\s*में\\s*पाएं"
        - "(?i)pin\\s+dalo\\s+paise\\s+milenge"

  - id: CRED_CARD_CVV_EXPIRY
    label: "Card Number, CVV or Expiry Solicitation"
    category: credentials
    weight: 35.0
    description: "Asks for 16-digit debit/credit card number, CVV code, or card expiration date."
    advice: "Never enter complete card numbers and CVV codes on unverified links or in text messages."
    patterns:
      en:
        - "(?i)(?:enter|share|update)\\s+(?:card\\s+details|cvv|3-digit\\s+code)"
        - "(?i)(?:debit|credit)\\s+card\\s+(?:number|details)\\s+and\\s+cvv"
        - "(?i)card\\s+expiry\\s+and\\s+atm\\s+pin"
      ta: # needs native-speaker review
        - "(?i)கார்டு\\s*விவரங்கள்\\s*மற்றும்\\s*சிவிவி"
        - "(?i)ஏடிஎம்\\s*பின்\\s*மற்றும்\\s*கார்டு\\s*எண்"
        - "(?i)card\\s+number\\s+cvv\\s+anupunga"
      hi: # needs native-speaker review
        - "(?i)कार्ड\\s*नंबर\\s*और\\s*सीवीवी"
        - "(?i)एटीएम\\s*पिन\\s*और\\s*कार्ड\\s*विवरण"
        - "(?i)card\\s+details\\s+aur\\s+cvv\\s+bheje"

  - id: CRED_NETBANKING_PASSWORD
    label: "NetBanking Login Password Solicitation"
    category: credentials
    weight: 35.0
    description: "Prompts user to provide their internet banking username, login password, or transaction password."
    advice: "Log in only through your bank's official app or official verified web address directly."
    patterns:
      en:
        - "(?i)(?:enter|share|provide|send|submit|ask\\s+for)\\s+(?:your\\s+)?(?:netbanking|internet\\s+banking)\\s+(?:password|login\\s+credentials|profile\\s+password)"
        - "(?i)(?:netbanking|internet\\s+banking)\\s+password\\s+(?:is\\s+required|needed|to\\s+unblock)"
        - "(?i)login\\s+with\\s+customer\\s+id\\s+and\\s+password\\s+to\\s+unblock"
        - "(?i)submit\\s+banking\\s+password"
      ta: # needs native-speaker review
        - "(?i)இணைய\\s*வங்கி\\s*கடவுச்சொல்"
        - "(?i)வங்கி\\s*பாஸ்வேர்ட்"
        - "(?i)netbanking\\s+password\\s+potu"
      hi: # needs native-speaker review
        - "(?i)नेटबैंकिंग\\s*पासवर्ड"
        - "(?i)लॉगिन\\s*आईडी\\s*और\\s*पासवर्ड"
        - "(?i)bank\\s+password\\s+darj\\s+kare"

  - id: CRED_AADHAAR_PAN_HARVESTING
    label: "Unsolicited Aadhaar or PAN Card Data Harvesting"
    category: credentials
    weight: 35.0
    description: "Asks user to submit photo of Aadhaar or PAN card via message, WhatsApp or untrusted form."
    advice: "Do not upload sensitive identity documents via unverified third-party forms or personal messaging."
    patterns:
      en:
        - "(?i)(?:send|upload|share)\\s+(?:photo\\s+of\\s+)?(?:aadhaar|pan\\s+card|voter\\s+id)"
        - "(?i)aadhaar\\s+(?:front\\s+and\\s+back|photo|copy)\\s+required"
        - "(?i)pan\\s+card\\s+linking\\s+mandatory"
      ta: # needs native-speaker review
        - "(?i)ஆதார்\\s*அட்டை\\s*(?:படம்|நகல்|அனுப்பவும்)"
        - "(?i)பான்\\s*கார்டு\\s*இணைக்க"
        - "(?i)aadhaar\\s+card\\s+photo\\s+anupunga"
      hi: # needs native-speaker review
        - "(?i)आधार\\s*कार्ड\\s*की\\s*फोटो\\s*भेजें"
        - "(?i)पैन\\s*कार्ड\\s*कॉपी\\s*अपलोड\\s*करें"
        - "(?i)aadhaar\\s+pan\\s+photo\\s+bheje"
