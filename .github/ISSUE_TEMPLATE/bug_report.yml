name: Bug Report
description: Report a reproducible software defect or unexpected behavior in ScamLens
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please ensure no private user data or live PII is included in this report.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Operating Mode
      description: In which mode did the issue occur?
      options:
        - Mock
        - Cloud (Gemini)
        - Local (Ollama)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '/'
        2. Upload sample image '...'
        3. Click 'Analyze Message'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
